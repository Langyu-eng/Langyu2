```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白泽宇 · 个人简历</title>
<style>
    :root {
        --primary: #2563eb;
        --primary-light: #3b82f6;
        --primary-dark: #1d4ed8;
        --secondary: #f59e0b;
        --secondary-light: #fbbf24;
        --bg: #f8fafc;
        --bg-card: #ffffff;
        --bg-alt: #f1f5f9;
        --text: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        --radius: 12px;
        --radius-sm: 8px;
        --transition: 200ms ease;
        --max-width: 1120px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        --nav-height: 64px;
    }
    [data-theme="dark"] {
        --primary: #3b82f6;
        --primary-light: #60a5fa;
        --primary-dark: #2563eb;
        --secondary: #fbbf24;
        --secondary-light: #fcd34d;
        --bg: #0f172a;
        --bg-card: #1e293b;
        --bg-alt: #0b1220;
        --text: #e2e8f0;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border: #334155;
        --shadow: 0 4px 6px -1px rgba(0,0,0,0.4), 0 2px 4px -1px rgba(0,0,0,0.3);
        --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -2px rgba(0,0,0,0.4);
    }
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html {
        scroll-behavior: smooth;
        scroll-padding-top: var(--nav-height);
    }
    body {
        font-family: var(--font);
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.6;
        transition: background-color var(--transition), color var(--transition);
        -webkit-font-smoothing: antialiased;
    }
    a {
        color: var(--primary);
        text-decoration: none;
        transition: color var(--transition);
    }
    a:hover {
        color: var(--primary-dark);
    }
    .container {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 0 24px;
    }
    /* Header */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--nav-height);
        background-color: var(--bg-card);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow);
        z-index: 1000;
        display: flex;
        align-items: center;
        transition: background-color var(--transition), border-color var(--transition);
    }
    .nav-container {
        width: 100%;
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }
    .brand {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.5px;
        white-space: nowrap;
    }
    .nav-links {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .nav-links a {
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-secondary);
        transition: background-color var(--transition), color var(--transition);
    }
    .nav-links a:hover {
        background-color: var(--bg-alt);
        color: var(--primary);
    }
    .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .icon-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.1rem;
        color: var(--text-secondary);
        transition: background-color var(--transition), border-color var(--transition), color var(--transition);
    }
    .icon-btn:hover {
        background-color: var(--bg-alt);
        border-color: var(--primary);
        color: var(--primary);
    }
    /* Hero */
    .hero {
        padding: calc(var(--nav-height) + 48px) 0 56px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #ffffff;
        text-align: center;
        border-bottom: 4px solid var(--secondary);
    }
    .hero .container {
        max-width: 900px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 32px;
    }
    .hero-avatar {
        flex: 0 0 auto;
    }
    .hero-avatar img {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid rgba(255,255,255,0.8);
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        transition: transform var(--transition), box-shadow var(--transition);
    }
    .hero-avatar img:hover {
        transform: scale(1.05);
        box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }
    .hero-text {
        flex: 1 1 300px;
        text-align: center;
    }
    .hero h1 {
        font-size: 2.8rem;
        font-weight: 800;
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .hero .subtitle {
        font-size: 1.3rem;
        font-weight: 500;
        margin-bottom: 12px;
        opacity: 0.95;
    }
    .hero .summary {
        font-size: 1.05rem;
        line-height: 1.7;
        margin-bottom: 24px;
        opacity: 0.92;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
    }
    .hero .badges {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 28px;
    }
    .hero .badge {
        background-color: rgba(255,255,255,0.2);
        backdrop-filter: blur(8px);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 500;
        border: 1px solid rgba(255,255,255,0.3);
        color: #fff;
    }
    .hero .cta-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
    }
    .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: transform var(--transition), box-shadow var(--transition), background-color var(--transition);
        border: none;
        text-decoration: none;
    }
    .btn-primary {
        background-color: #ffffff;
        color: var(--primary-dark);
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }
    .btn-outline {
        background-color: transparent;
        color: #ffffff;
        border: 2px solid rgba(255,255,255,0.7);
    }
    .btn-outline:hover {
        background-color: rgba(255,255,255,0.1);
        transform: translateY(-2px);
    }
    /* Sections */
    section {
        padding: 56px 0;
    }
    .section-title {
        font-size: 1.9rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
        color: var(--text);
    }
    .section-subtitle {
        text-align: center;
        color: var(--text-secondary);
        margin-bottom: 32px;
        font-size: 1rem;
    }
    .divider {
        width: 60px;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        border-radius: 2px;
        margin: 0 auto 24px;
    }
    /* Highlights */
    .highlights-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
    }
    .highlight-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow);
        transition: transform var(--transition), box-shadow var(--transition);
        text-align: center;
    }
    .highlight-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow-lg);
    }
    .highlight-number {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 8px;
    }
    .highlight-text {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
    }
    /* Tabs */
    .tabs {
        margin-top: 16px;
    }
    .tab-list {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 24px;
    }
    .tab-btn {
        padding: 10px 20px;
        border-radius: 30px;
        border: 1px solid var(--border);
        background-color: var(--bg-card);
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all var(--transition);
    }
    .tab-btn[aria-selected="true"] {
        background-color: var(--primary);
        color: #ffffff;
        border-color: var(--primary);
        box-shadow: 0 4px 10px rgba(37,99,235,0.3);
    }
    .tab-btn:hover:not([aria-selected="true"]) {
        background-color: var(--bg-alt);
        border-color: var(--primary-light);
    }
    .tab-panel {
        display: none;
        animation: fadeIn 0.3s ease;
    }
    .tab-panel.active {
        display: block;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    /* Experience & Project cards */
    .exp-card, .project-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
        transition: transform var(--transition), box-shadow var(--transition);
    }
    .exp-card:hover, .project-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
    }
    .exp-header, .project-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
        gap: 8px;
    }
    .exp-title, .project-name {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--text);
    }
    .exp-company, .project-period {
        font-size: 0.9rem;
        color: var(--text-secondary);
    }
    .exp-location, .project-location {
        font-size: 0.85rem;
        color: var(--text-muted);
    }
    .exp-points {
        list-style: none;
        padding-left: 0;
    }
    .exp-points li {
        position: relative;
        padding-left: 20px;
        margin-bottom: 8px;
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
    }
    .exp-points li::before {
        content: "▹";
        position: absolute;
        left: 0;
        color: var(--secondary);
        font-weight: bold;
    }
    .project-tech {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
    }
    .tech-badge {
        background-color: var(--bg-alt);
        color: var(--primary);
        padding: 4px 12px;
        border-radius: 16px;
        font-size: 0.8rem;
        font-weight: 500;
        border: 1px solid var(--border);
    }
    .project-description {
        color: var(--text-secondary);
        margin: 10px 0;
        font-size: 0.95rem;
    }
    .project-results {
        list-style: none;
        padding-left: 0;
        margin-top: 8px;
    }
    .project-results li {
        padding-left: 20px;
        position: relative;
        margin-bottom: 4px;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }
    .project-results li::before {
        content: "✓";
        position: absolute;
        left: 0;
        color: #10b981;
        font-weight: bold;
    }
    /* Skills */
    .skills-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
    }
    .skill-category {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: var(--shadow);
    }
    .skill-category h3 {
        font-size: 1.1rem;
        margin-bottom: 16px;
        color: var(--text);
        border-bottom: 2px solid var(--border);
        padding-bottom: 8px;
    }
    .skill-item {
        margin-bottom: 12px;
    }
    .skill-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        margin-bottom: 4px;
        color: var(--text-secondary);
    }
    .skill-bar {
        height: 8px;
        background-color: var(--bg-alt);
        border-radius: 4px;
        overflow: hidden;
    }
    .skill-bar-fill {
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        transition: width 0.8s ease;
    }
    /* Education & Awards */
    .edu-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
    }
    .edu-icon {
        font-size: 2rem;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-alt);
        border-radius: 50%;
    }
    .edu-info {
        flex: 1;
        min-width: 220px;
    }
    .edu-info h3 {
        font-size: 1.2rem;
        margin-bottom: 4px;
    }
    .edu-meta {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin-bottom: 8px;
    }
    .edu-courses {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
    }
    .course-tag {
        background-color: var(--bg-alt);
        padding: 4px 10px;
        border-radius: 14px;
        font-size: 0.8rem;
        color: var(--text-secondary);
        border: 1px solid var(--border);
    }
    .awards-section {
        margin-top: 24px;
    }
    .awards-category {
        margin-bottom: 16px;
    }
    .awards-category h4 {
        font-size: 1rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 8px;
    }
    .awards-list {
        list-style: none;
        padding-left: 0;
    }
    .awards-list li {
        padding: 6px 0;
        border-bottom: 1px dashed var(--border);
        font-size: 0.9rem;
        color: var(--text-secondary);
    }
    .awards-list li:last-child {
        border-bottom: none;
    }
    /* Certificate Gallery */
    .cert-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
        margin-top: 16px;
    }
    .cert-item {
        position: relative;
        cursor: pointer;
        border-radius: var(--radius-sm);
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        transition: transform var(--transition), box-shadow var(--transition);
    }
    .cert-item:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
    }
    .cert-item img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
        background-color: var(--bg-alt);
    }
    .cert-item .cert-label {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(transparent, rgba(0,0,0,0.7));
        color: #fff;
        font-size: 0.75rem;
        padding: 20px 8px 6px;
        text-align: center;
        pointer-events: none;
    }
    /* Lightbox */
    .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0,0,0,0.9);
        z-index: 2000;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .lightbox.active {
        display: flex;
    }
    .lightbox img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 8px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .lightbox-close {
        position: absolute;
        top: 24px;
        right: 24px;
        background: none;
        border: 2px solid #fff;
        color: #fff;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
        cursor: pointer;
        transition: background-color var(--transition);
    }
    .lightbox-close:hover {
        background-color: rgba(255,255,255,0.2);
    }
    /* Contact */
    .contact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 24px;
    }
    .contact-item {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 16px;
        text-align: center;
        box-shadow: var(--shadow);
        transition: transform var(--transition);
    }
    .contact-item:hover {
        transform: translateY(-3px);
    }
    .contact-icon {
        font-size: 1.5rem;
        margin-bottom: 8px;
    }
    .contact-label {
        font-size: 0.85rem;
        color: var(--text-muted);
    }
    .contact-value {
        font-weight: 600;
        color: var(--text);
        word-break: break-all;
    }
    .copy-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--primary);
        font-size: 0.9rem;
        margin-top: 4px;
        transition: color var(--transition);
    }
    .copy-btn:hover {
        color: var(--primary-dark);
        text-decoration: underline;
    }
    /* Footer */
    .footer {
        background-color: var(--bg-card);
        border-top: 1px solid var(--border);
        padding: 24px 0;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.9rem;
    }
    /* Back to top */
    .back-to-top {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background-color: var(--primary);
        color: #fff;
        border: none;
        box-shadow: var(--shadow-lg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        opacity: 0;
        visibility: hidden;
        transform: translateY(20px);
        transition: all var(--transition);
        z-index: 999;
    }
    .back-to-top.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }
    .back-to-top:hover {
        background-color: var(--primary-dark);
    }
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }
    /* Responsive */
    @media (max-width: 768px) {
        .nav-container {
            flex-wrap: wrap;
            height: auto;
            padding: 8px 16px;
        }
        .nav-links {
            order: 3;
            width: 100%;
            justify-content: center;
            margin-top: 8px;
        }
        .hero .container {
            flex-direction: column;
            text-align: center;
        }
        .hero-avatar img {
            width: 110px;
            height: 110px;
        }
        .hero h1 {
            font-size: 2.2rem;
        }
        .hero .subtitle {
            font-size: 1.1rem;
        }
        section {
            padding: 40px 0;
        }
        .section-title {
            font-size: 1.6rem;
        }
        .exp-header, .project-header {
            flex-direction: column;
            align-items: flex-start;
        }
        .cert-item img {
            height: 140px;
        }
    }
    /* Print */
    @media print {
        .navbar, .back-to-top, .icon-btn, .copy-btn, .tab-list, .lightbox {
            display: none !important;
        }
        body {
            background-color: #fff;
            color: #000;
        }
        .hero {
            background: #2563eb !important;
            color: #fff !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .tab-panel {
            display: block !important;
        }
        .exp-card, .project-card, .highlight-card, .skill-category, .edu-card, .contact-item, .cert-item {
            box-shadow: none;
            border: 1px solid #ddd;
            break-inside: avoid;
        }
        .cert-item img {
            height: auto;
            max-height: 120px;
        }
        section {
            padding: 20px 0;
        }
        .container {
            max-width: 100%;
            padding: 0 12px;
        }
    }
</style>
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="#about" class="brand">白泽宇</a>
            <nav class="nav-links" id="navLinks" aria-label="主导航"></nav>
            <div class="nav-actions">
                <button class="icon-btn" id="themeToggle" aria-label="切换深浅色模式" title="切换深浅色模式">🌓</button>
                <button class="icon-btn" id="printBtn" aria-label="打印简历" title="打印简历">🖨️</button>
            </div>
        </div>
    </header>

            // Tab 绑定函数
            function bindTabs(tabList, panelsContainer) {
                const tabs = $$('[role="tab"]', tabList);
                const panels = $$('[role="tabpanel"]', panelsContainer);

                function selectTab(targetId) {
                    tabs.forEach(tab => {
                        const selected = tab.dataset.target === targetId;
                        tab.setAttribute('aria-selected', selected);
                        tab.tabIndex = selected ? 0 : -1;
                    });
                    panels.forEach(panel => {
                        const active = panel.id === `exp-panel-${targetId}` || panel.id === `proj-panel-${targetId}`;
                        if (active) {
                            panel.classList.add('active');
                            panel.hidden = false;
                        } else {
                            panel.classList.remove('active');
                            panel.hidden = true;
                        }
                    });
                }

                tabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        selectTab(tab.dataset.target);
                    });
                });

                tabList.addEventListener('keydown', (e) => {
                    const currentIndex = tabs.indexOf(document.activeElement);
                    if (currentIndex === -1) return;
                    let newIndex = null;
                    if (e.key === 'ArrowRight') {
                        newIndex = (currentIndex + 1) % tabs.length;
                        e.preventDefault();
                    } else if (e.key === 'ArrowLeft') {
                        newIndex = (currentIndex - 1 + tabs.length) % tabs.length;
                        e.preventDefault();
                    }
                    if (newIndex !== null) {
                        tabs[newIndex].focus();
                        selectTab(tabs[newIndex].dataset.target);
                    }
                });
            }

                awardContainer.appendChild(createEl('div', 'divider'));

                const awardsDiv = createEl('div', 'awards-section');
                const categories = [
                    { key: 'national', label: '国家级', items: resume.awards.national },
                    { key: 'provincial', label: '省市级', items: resume.awards.provincial },
                    { key: 'county', label: '区县级及才艺', items: resume.awards.county }
                ];
                categories.forEach(cat => {
                    if (cat.items && cat.items.length > 0) {
                        const catDiv = createEl('div', 'awards-category');

                        cat.items.forEach(item => ul.appendChild(createEl('li', '', item)));
                        catDiv.appendChild(ul);
                        awardsDiv.appendChild(catDiv);
                    }
                });
                // 技能证书（文字）
                if (resume.certificates && resume.certificates.length > 0) {
                    const certDiv = createEl('div', 'awards-category');
                    certDiv.appendChild(createEl('h4', '', '技能证书'));

                // 证书图片展示
                const certGallerySection = createEl('div', 'awards-category');

            // Lightbox 功能
            function openLightbox(src) {
                const lightbox = $('#lightbox');
                const img = $('#lightboxImg');
                img.src = src;
                lightbox.classList.add('active');
                lightbox.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }
            function closeLightbox() {
                const lightbox = $('#lightbox');
                lightbox.classList.remove('active');
                lightbox.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            // 渲染联系
            function renderContact() {
                const main = $('#mainContent');
                const sec = createEl('section', '');
                sec.id = 'contact';
                const container = createEl('div', 'container');
                container.appendChild(createEl('h2', 'section-title', '联系方式'));
                container.appendChild(createEl('div', 'divider'));
                const grid = createEl('div', 'contact-grid');

                const items = [
                    { icon: '📞', label: '电话', value: resume.contact.phone, type: 'tel' },
                    { icon: '✉️', label: '邮箱', value: resume.contact.email, type: 'email' },
                    { icon: '💬', label: '微信', value: resume.contact.wechat, type: 'text' },
                    { icon: '📍', label: '地址', value: resume.contact.location, type: 'text' },
                    { icon: '🏛️', label: '政治面貌', value: resume.contact.political, type: 'text' }
                ];

                items.forEach(item => {
                    const card = createEl('div', 'contact-item');
                    card.appendChild(createEl('div', 'contact-icon', item.icon));
                    card.appendChild(createEl('div', 'contact-label', item.label));
                    const value = createEl('div', 'contact-value', item.value);
                    card.appendChild(value);
                    if (item.type === 'email') {
                        const copyBtn = createEl('button', 'copy-btn', '复制邮箱');
                        copyBtn.dataset.email = item.value;
                        copyBtn.addEventListener('click', function(e) {
                            const email = this.dataset.email;
                            if (navigator.clipboard) {
                                navigator.clipboard.writeText(email).then(() => {
                                    this.textContent = '已复制！';
                                    setTimeout(() => this.textContent = '复制邮箱', 1500);
                                });
                            } else {
                                const textArea = document.createElement('textarea');
                                textArea.value = email;
                                document.body.appendChild(textArea);
                                textArea.select();
                                document.execCommand('copy');
                                document.body.removeChild(textArea);
                                this.textContent = '已复制！';
                                setTimeout(() => this.textContent = '复制邮箱', 1500);
                            }
                        });
                        card.appendChild(copyBtn);
                    }
                    grid.appendChild(card);
                });
                container.appendChild(grid);
                sec.appendChild(container);
                main.appendChild(sec);
            }

            // 渲染页脚
            function renderFooter() {
                const footer = $('#footer');
                footer.innerHTML = `<p>© 2026 ${resume.name} · 更新时间：2026.08</p>`;
            }

            // 初始化渲染
            function init() {
                renderNav();
                renderHero();
                renderHighlights();
                renderExperience();
                renderProjects();
                renderSkills();
                renderEducationAndAwards();
                renderContact();
                renderFooter();

                // 返回顶部按钮
                const backToTop = $('#backToTop');
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 300) {
                        backToTop.classList.add('visible');
                    } else {
                        backToTop.classList.remove('visible');
                    }
                });
                backToTop.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                // 深浅色切换
                const themeToggle = $('#themeToggle');
                themeToggle.addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme');
                    if (current === 'dark') {
                        document.documentElement.removeAttribute('data-theme');
                        themeToggle.textContent = '🌓';
                    } else {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        themeToggle.textContent = '☀️';
                    }
                });

                // 打印按钮
                const printBtn = $('#printBtn');
                printBtn.addEventListener('click', () => {
                    window.print();
                });

                // Lightbox 关闭
                const lightbox = $('#lightbox');
                const lightboxClose = $('#lightboxClose');
                lightboxClose.addEventListener('click', closeLightbox);
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) closeLightbox();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeLightbox();
                });
            }

            // DOM 加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
